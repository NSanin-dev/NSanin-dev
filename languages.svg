<svg xmlns="http://www.w3.org/2000/svg" width="280" height="44" viewBox="0 0 280 44" role="img" aria-label="Languages: English and Spanish">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#151133"/>
    </linearGradient>
    <clipPath id="flag">
      <rect width="30" height="20" rx="3"/>
    </clipPath>
    <clipPath id="uk">
      <path d="M30 20h30v20zv20H0zH0V0zV0h30z"/>
    </clipPath>
  </defs>

  <rect x="0.75" y="0.75" width="278.5" height="42.5" rx="10" fill="url(#bg)" stroke="#2A2F55" stroke-width="1.5"/>

  <!-- English: United Kingdom flag -->
  <g transform="translate(20 12)">
    <g clip-path="url(#flag)">
      <g transform="scale(0.5)">
        <rect width="60" height="40" fill="#012169"/>
        <path d="M0 0l60 40m0-40L0 40" stroke="#FFFFFF" stroke-width="8"/>
        <path d="M0 0l60 40m0-40L0 40" clip-path="url(#uk)" stroke="#C8102E" stroke-width="5"/>
        <path d="M30 0v40M0 20h60" stroke="#FFFFFF" stroke-width="10"/>
        <path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="6"/>
      </g>
    </g>
    <rect width="30" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>
  </g>
  <text x="60" y="27" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F6FF">English</text>

  <!-- divider -->
  <rect x="140" y="12" width="1.5" height="20" rx="0.75" fill="#2A2F55"/>

  <!-- Spanish: Spain flag -->
  <g transform="translate(158 12)">
    <g clip-path="url(#flag)">
      <rect width="30" height="20" fill="#AA151B"/>
      <rect y="5" width="30" height="10" fill="#F1BF00"/>
    </g>
    <rect width="30" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>
  </g>
  <text x="198" y="27" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F6FF">Spanish</text>
</svg>
