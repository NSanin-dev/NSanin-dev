<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" fill="none" role="img" aria-label="NSanin-dev: C# developer, ASP.NET Core and Blazor, founder of Ludonix YBX Holdings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#151133"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="858" height="238" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="860" height="240" fill="url(#bg)"/>
    <rect x="0" y="0" width="860" height="240" fill="url(#dots)"/>
    <rect x="0" y="0" width="860" height="240" fill="url(#glow)"/>

    <!-- floating code glyphs -->
    <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="22" font-weight="700" fill="#22D3EE">
      <text x="70" y="240" opacity="0.0">{ }
        <animateTransform attributeName="transform" type="translate" values="0,0; 14,-270" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.35;0.35;0" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="200" y="240" opacity="0.0" fill="#7C5CFF">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0,0; -16,-270" dur="11s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0.4;0" dur="11s" begin="-3s" repeatCount="indefinite"/>
      </text>
      <text x="360" y="240" opacity="0.0">C#
        <animateTransform attributeName="transform" type="translate" values="0,0; 10,-270" dur="10s" begin="-6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.3;0.3;0" dur="10s" begin="-6s" repeatCount="indefinite"/>
      </text>
      <text x="520" y="240" opacity="0.0" fill="#7C5CFF">;
        <animateTransform attributeName="transform" type="translate" values="0,0; -12,-270" dur="8s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0.45;0" dur="8s" begin="-2s" repeatCount="indefinite"/>
      </text>
      <text x="660" y="240" opacity="0.0">=&gt;
        <animateTransform attributeName="transform" type="translate" values="0,0; 18,-270" dur="12s" begin="-8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.35;0.35;0" dur="12s" begin="-8s" repeatCount="indefinite"/>
      </text>
      <text x="780" y="240" opacity="0.0" fill="#7C5CFF">( )
        <animateTransform attributeName="transform" type="translate" values="0,0; -10,-270" dur="9.5s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.4;0.4;0" dur="9.5s" begin="-5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- small label -->
    <text x="430" y="62" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" letter-spacing="6" fill="#9CA3C7">SOFTWARE DEVELOPER</text>

    <!-- name with blinking cursor -->
    <text x="430" y="132" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace"
          font-size="66" font-weight="700" fill="#F4F6FF">NSanin-dev<tspan fill="#22D3EE">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <!-- stack line -->
    <text x="430" y="170" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="20" letter-spacing="2" fill="url(#accent)">C#  ·  ASP.NET Core  ·  Blazor WASM</text>

    <!-- tagline -->
    <text x="430" y="203" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14" fill="#8D93B8">Founder @ Ludonix YBX Holdings  ·  Vancouver, BC</text>

    <!-- sweeping accent line -->
    <rect x="130" y="222" width="600" height="2" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="130" y="222" width="200" height="2" fill="url(#line)">
      <animate attributeName="x" values="130;530;130" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="858" height="238" rx="12" stroke="#2A2F55" stroke-width="1.5"/>
</svg>
